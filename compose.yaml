services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MEDROUTE_DB_NAME:-medroute}
      POSTGRES_USER: ${MEDROUTE_DB_USER:-medroute}
      POSTGRES_PASSWORD: ${MEDROUTE_DB_PASSWORD:-medroute}
    ports:
      - "127.0.0.1:${MEDROUTE_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEDROUTE_DB_USER:-medroute} -d ${MEDROUTE_DB_NAME:-medroute}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - medroute-postgres-data:/var/lib/postgresql/data

  navigation-server:
    profiles: ["pilot"]
    build:
      context: ./hospital-navigation-server
    environment:
      MEDROUTE_DB_URL: jdbc:postgresql://postgres:5432/${MEDROUTE_DB_NAME:-medroute}
      MEDROUTE_DB_USER: ${MEDROUTE_DB_USER:-medroute}
      MEDROUTE_DB_PASSWORD: ${MEDROUTE_DB_PASSWORD:-medroute}
      MEDROUTE_DB_POOL_SIZE: ${MEDROUTE_DB_POOL_SIZE:-8}
      MEDROUTE_SERVER_ADDRESS: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/api/buildings/00000000-0000-0000-0000-000000000100/navigation-context",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  pilot-gateway:
    profiles: ["pilot"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.pilot
    ports:
      - "${MEDROUTE_NAVIGATION_PORT:-8088}:80"
      - "127.0.0.1:${MEDROUTE_ADMIN_PORT:-8089}:81"
    depends_on:
      navigation-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/api/buildings/00000000-0000-0000-0000-000000000100/navigation-context || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  medroute-postgres-data:
