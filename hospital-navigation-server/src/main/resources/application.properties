spring.application.name=hospital-navigation-server
server.port=8080
server.address=${MEDROUTE_SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${MEDROUTE_DB_URL:jdbc:postgresql://127.0.0.1:5432/medroute}
spring.datasource.username=${MEDROUTE_DB_USER:medroute}
spring.datasource.password=${MEDROUTE_DB_PASSWORD:medroute}
spring.datasource.hikari.maximum-pool-size=${MEDROUTE_DB_POOL_SIZE:8}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

spring.mvc.problemdetails.enabled=false
spring.web.resources.add-mappings=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
