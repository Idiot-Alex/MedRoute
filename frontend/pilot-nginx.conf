upstream medroute_backend {
    server navigation-server:8080;
    keepalive 16;
}

map $http_x_request_id $medroute_request_id {
    default $http_x_request_id;
    "" $request_id;
}

map $http_origin $medroute_admin_origin_allowed {
    default 0;
    "" 1;
    ~^https?://(127\.0\.0\.1|localhost)(:[0-9]+)?$ 1;
}

server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/navigation;
    index index.html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /api/routes {
        default_type application/json;
        if ($request_method != POST) {
            return 405 '{"error":{"code":"METHOD_NOT_ALLOWED","message":"Method not allowed."}}';
        }
        proxy_pass http://medroute_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $medroute_request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location ~ ^/api/buildings/[0-9a-fA-F-]+/(navigation-context|pois)$ {
        default_type application/json;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 '{"error":{"code":"METHOD_NOT_ALLOWED","message":"Method not allowed."}}';
        }
        proxy_pass http://medroute_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $medroute_request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location ~ ^/api/map-images/[0-9a-fA-F-]+$ {
        default_type application/json;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 '{"error":{"code":"METHOD_NOT_ALLOWED","message":"Method not allowed."}}';
        }
        proxy_pass http://medroute_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $medroute_request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location ^~ /api/admin {
        default_type application/json;
        return 404 '{"error":{"code":"RESOURCE_NOT_FOUND","message":"Not found."}}';
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"RESOURCE_NOT_FOUND","message":"Not found."}}';
    }

    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 81;
    server_name _;
    root /usr/share/nginx/admin;
    index index.html;
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    if ($medroute_admin_origin_allowed = 0) {
        return 403;
    }

    location /api/ {
        proxy_pass http://medroute_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $medroute_request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
