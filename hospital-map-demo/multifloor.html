<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="MedRoute 多楼层医院路线测试页面"
    >
    <title>MedRoute 多楼层路线测试</title>
    <link rel="stylesheet" href="./multifloor.css">
    <script defer src="./multifloor.js"></script>
  </head>
  <body>
    <div class="app-shell" data-page-state="loading">
      <header class="app-header">
        <div>
          <p class="product-name">MedRoute</p>
          <h1>多楼层路线测试</h1>
        </div>
        <p id="connection-status" class="connection-status" aria-live="polite">
          正在连接导航服务
        </p>
      </header>

      <main class="workspace">
        <section class="control-panel" aria-labelledby="route-form-title">
          <div class="panel-heading">
            <h2 id="route-form-title">路线设置</h2>
          </div>

          <form id="route-form" novalidate>
            <div class="field-group">
              <label for="start-poi">起点</label>
              <select id="start-poi" name="startPoiId" disabled></select>
            </div>

            <div class="field-group">
              <label for="end-poi">终点</label>
              <select id="end-poi" name="endPoiId" disabled></select>
            </div>

            <button id="swap-route" class="text-action" type="button" disabled>
              互换起终点
            </button>

            <fieldset class="mode-fieldset">
              <legend>路线偏好</legend>
              <div class="mode-switch" role="group" aria-label="路线偏好">
                <button
                  class="mode-button is-selected"
                  type="button"
                  data-route-mode="normal"
                  aria-pressed="true"
                  disabled
                >
                  普通路线
                </button>
                <button
                  class="mode-button"
                  type="button"
                  data-route-mode="accessible"
                  aria-pressed="false"
                  disabled
                >
                  无障碍
                </button>
              </div>
            </fieldset>

            <button id="calculate-route" class="primary-action" type="submit" disabled>
              规划路线
            </button>
            <p id="form-message" class="form-message" aria-live="polite"></p>
          </form>

          <div class="testing-notice">
            <p>测试数据</p>
            <span>
              路线、连接关系和 A/B 编号均为项目示例，不能作为医院导诊依据。
            </span>
          </div>
        </section>

        <section class="map-panel" aria-labelledby="map-title">
          <div class="map-toolbar">
            <div>
              <h2 id="map-title">楼层路线图</h2>
              <p id="floor-caption">正在加载底图</p>
            </div>
            <div id="floor-tabs" class="floor-tabs" role="tablist" aria-label="选择楼层"></div>
          </div>

          <div id="map-frame" class="map-frame is-loading">
            <img id="floor-image" alt="">
            <svg
              id="route-overlay"
              class="route-overlay"
              viewBox="0 0 1000 800"
              preserveAspectRatio="xMidYMid meet"
              aria-hidden="true"
            ></svg>
            <p id="map-empty-state" class="map-empty-state" hidden></p>
          </div>

          <div id="floor-transition" class="floor-transition" aria-live="polite"></div>

          <p class="source-note">
            底图来源：
            <a href="http://www.hndfsrmyy.com/w/155.html" target="_blank" rel="noreferrer">
              东方市人民医院公开楼层分布页
            </a>
            ，仅用于本地测试。
          </p>
        </section>

        <section class="route-panel" aria-labelledby="route-result-title">
          <div class="panel-heading">
            <h2 id="route-result-title">路线结果</h2>
            <p id="route-mode-label">尚未计算</p>
          </div>

          <div id="route-summary" class="route-summary is-empty" aria-live="polite">
            <p>选择起点和终点后，路线会由后端服务计算。</p>
          </div>

          <ol id="route-steps" class="route-steps" aria-label="路线步骤"></ol>
        </section>
      </main>
    </div>
  </body>
</html>
