<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="MedRoute 医院室内路线导航"
    >
    <title>MedRoute 医院室内导航</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./multifloor.css?v=20260726-3">
    <script defer src="./multifloor.js?v=20260726-3"></script>
  </head>
  <body>
    <div class="app-shell" data-page-state="loading">
      <header class="app-header">
        <div class="app-identity">
          <span class="brand-mark" aria-hidden="true">M</span>
          <div>
            <p class="product-name">MedRoute</p>
            <h1 id="building-name">医院室内导航</h1>
          </div>
        </div>
        <p
          id="connection-status"
          class="connection-status"
          data-state="loading"
          aria-live="polite"
        >
          正在连接导航服务
        </p>
      </header>

      <main class="workspace">
        <section class="control-panel" aria-labelledby="route-form-title">
          <div class="panel-heading">
            <h2 id="route-form-title">去哪儿</h2>
            <p>选择院内地点</p>
          </div>

          <form id="route-form" novalidate>
            <div class="route-endpoints">
              <div class="endpoint-field">
                <span class="endpoint-mark is-start" aria-hidden="true">起</span>
                <div class="field-group">
                  <label for="start-poi-trigger">起点</label>
                  <button
                    id="start-poi-trigger"
                    class="poi-trigger"
                    type="button"
                    aria-haspopup="dialog"
                    disabled
                  >
                    <span id="start-poi-value">正在加载地点</span>
                    <span aria-hidden="true">›</span>
                  </button>
                  <select
                    id="start-poi"
                    class="endpoint-select"
                    name="startPoiId"
                    aria-hidden="true"
                    tabindex="-1"
                    disabled
                  ></select>
                </div>
              </div>

              <button
                id="swap-route"
                class="swap-action"
                type="button"
                aria-label="互换起点和终点"
                title="互换起点和终点"
                disabled
              >
                <span aria-hidden="true">⇅</span>
              </button>

              <div class="endpoint-field">
                <span class="endpoint-mark is-end" aria-hidden="true">终</span>
                <div class="field-group">
                  <label for="end-poi-trigger">终点</label>
                  <button
                    id="end-poi-trigger"
                    class="poi-trigger"
                    type="button"
                    aria-haspopup="dialog"
                    disabled
                  >
                    <span id="end-poi-value">正在加载地点</span>
                    <span aria-hidden="true">›</span>
                  </button>
                  <select
                    id="end-poi"
                    class="endpoint-select"
                    name="endPoiId"
                    aria-hidden="true"
                    tabindex="-1"
                    disabled
                  ></select>
                </div>
              </div>
            </div>

            <fieldset class="mode-fieldset">
              <legend>路线偏好</legend>
              <div class="mode-switch" role="group" aria-label="路线偏好">
                <button
                  class="mode-button is-selected"
                  type="button"
                  data-route-mode="normal"
                  aria-pressed="true"
                  disabled
                >
                  普通路线
                </button>
                <button
                  class="mode-button"
                  type="button"
                  data-route-mode="accessible"
                  aria-pressed="false"
                  disabled
                >
                  无障碍
                </button>
              </div>
            </fieldset>

            <button id="calculate-route" class="primary-action" type="submit" disabled>
              规划路线
            </button>
            <p id="form-message" class="form-message" aria-live="polite"></p>
          </form>
        </section>

        <section class="map-panel" aria-labelledby="map-title">
          <div class="map-toolbar">
            <div class="map-title-group">
              <h2 id="map-title">楼层路线图</h2>
              <p id="floor-caption">正在加载底图</p>
            </div>
            <div class="map-actions">
              <div
                id="floor-tabs"
                class="floor-tabs"
                role="tablist"
                aria-label="选择楼层"
              ></div>
              <button
                id="expand-map"
                class="icon-action"
                type="button"
                aria-label="全屏查看地图"
                title="全屏查看地图"
              >
                <span id="expand-map-icon" aria-hidden="true">⛶</span>
              </button>
            </div>
          </div>

          <div id="route-brief" class="route-brief" aria-live="polite" hidden>
            <div>
              <strong id="route-brief-title"></strong>
              <span id="route-brief-meta"></span>
            </div>
            <button id="show-route-steps" class="brief-action" type="button">
              查看步骤
            </button>
          </div>

          <div id="map-frame" class="map-frame is-loading">
            <div id="map-canvas" class="map-canvas">
              <img id="floor-image" alt="">
              <svg
                id="route-overlay"
                class="route-overlay"
                viewBox="0 0 1000 800"
                preserveAspectRatio="xMidYMid meet"
                aria-hidden="true"
              ></svg>
            </div>
            <p id="map-empty-state" class="map-empty-state" hidden></p>
          </div>

          <div id="floor-transition" class="floor-transition" aria-live="polite"></div>

          <p class="source-note">
            <span>测试路线不能作为现场导诊依据。</span>
            <span>
              底图参考
              <a href="http://www.hndfsrmyy.com/w/155.html" target="_blank" rel="noreferrer">
                东方市人民医院公开楼层分布页
              </a>
              。
            </span>
          </p>
        </section>

        <section class="route-panel" aria-labelledby="route-result-title">
          <div class="panel-heading">
            <h2 id="route-result-title">详细步骤</h2>
            <p id="route-mode-label">尚未计算</p>
          </div>

          <div id="route-summary" class="route-summary is-empty" aria-live="polite">
            <p>选择起点和终点后，路线会由后端服务计算。</p>
          </div>

          <ol id="route-steps" class="route-steps" aria-label="路线步骤"></ol>
        </section>
      </main>
    </div>

    <dialog
      id="poi-search-dialog"
      class="poi-search-dialog"
      aria-labelledby="poi-search-title"
    >
      <div class="poi-search-sheet">
        <header class="poi-search-header">
          <div>
            <p id="poi-search-endpoint">选择起点</p>
            <h2 id="poi-search-title">选择院内地点</h2>
          </div>
          <button
            id="close-poi-search"
            class="dialog-close"
            type="button"
            aria-label="关闭地点搜索"
            title="关闭"
          >
            <span aria-hidden="true">×</span>
          </button>
        </header>

        <div class="poi-search-controls">
          <label class="poi-search-field">
            <span class="sr-only">搜索地点</span>
            <input
              id="poi-search-input"
              type="search"
              inputmode="search"
              autocomplete="off"
              placeholder="搜索科室、地点或关键词"
            >
          </label>
          <div
            id="poi-floor-filters"
            class="poi-floor-filters"
            role="tablist"
            aria-label="按楼层筛选"
          ></div>
        </div>

        <p id="poi-search-count" class="poi-search-count" aria-live="polite"></p>
        <ul id="poi-search-results" class="poi-search-results"></ul>
        <p id="poi-search-empty" class="poi-search-empty" hidden>
          没有找到匹配地点
        </p>
      </div>
    </dialog>
  </body>
</html>
